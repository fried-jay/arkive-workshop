<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>캐치마인드 — 그림 제출</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    canvas { width: 100%; border: 2px solid var(--border); border-radius: 12px; background: #fff; touch-action: none; display: block; }
    .toolbar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
    .color { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .color.active { border-color: var(--accent); }
    .tool-btn { border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: var(--text); font-family: inherit; }
    .tool-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    input[type="text"] { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card" id="submit-view">
      <h1>🎨 캐치마인드 — 그림 제출</h1>
      <p class="muted">정답 단어를 정하고 그림으로 표현해 제출하세요. 행사 때 하나씩 공개해 다 같이 맞힙니다. (정답 단어는 공개 전까지 아무도 못 봐요)</p>
      <input type="text" id="name-input" placeholder="이름" autocomplete="off" maxlength="20">
      <div id="prompt-banner" class="hidden" style="margin:8px 0;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:1.15rem">✏️ 제시어: <span id="prompt-word"></span></div>
      <input type="text" id="word-input" placeholder="정답 단어 (예: 맥북)" autocomplete="off" maxlength="30">
      <div class="toolbar">
        <button class="color active" type="button" style="background:#111827" data-color="#111827" aria-label="검정"></button>
        <button class="color" type="button" style="background:#e11d48" data-color="#e11d48" aria-label="빨강"></button>
        <button class="color" type="button" style="background:#2563eb" data-color="#2563eb" aria-label="파랑"></button>
        <button class="color" type="button" style="background:#16a34a" data-color="#16a34a" aria-label="초록"></button>
        <button class="tool-btn" type="button" id="size-btn">굵게</button>
        <button class="tool-btn" type="button" id="undo-btn">↩ 한 획</button>
        <button class="tool-btn" type="button" id="clear-btn">전체 지우기</button>
      </div>
      <canvas id="canvas"></canvas>
      <p class="error" id="err"></p>
      <p style="margin-top:12px"><button class="btn block" id="submit-btn">✅ 제출하기</button></p>
    </section>

    <section class="card hidden" id="done-view">
      <h1>🙌 제출 완료!</h1>
      <p class="muted">행사 때 공개될 거예요. 마음에 안 들면 다시 그려서 수정 제출할 수 있어요.</p>
      <button class="btn secondary" id="again-btn">✏️ 다시 그리기</button>
    </section>
  </div>
  <script src="/catchmind-canvas.js"></script>
  <script src="/catchmind.js"></script>
</body>
</html>
