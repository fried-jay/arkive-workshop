<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>캐치마인드</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    canvas { width: 100%; border: 2px solid var(--border); border-radius: 12px; background: #fff; display: block; }
    .guess-row { display: flex; gap: 8px; margin-top: 12px; }
    .guess-row input { flex: 1; }
    .feed { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .feed li { background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; }
    .waiting { text-align: center; padding: 30px 0; }
    .owner-reveal { text-align: center; font-size: 1.15rem; font-weight: 800; margin-top: 14px; color: #16a34a; }
    .score { font-weight: 800; color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="join-view" class="card">
      <h1>🎨 캐치마인드</h1>
      <p class="muted">이름을 입력하고 입장하세요. 진행자가 지목한 사람이 그림을 그리면, 나머지가 뭘 그렸는지 맞춥니다.</p>
      <form id="join-form">
        <input type="text" id="name-input" placeholder="이름" autocomplete="off" maxlength="20">
        <p class="error" id="join-error"></p>
        <button class="btn" type="submit">입장하기</button>
      </form>
    </section>

    <section id="game-view" class="card hidden">
      <div class="statusbar" style="margin-top:0">
        <span id="greeting"></span>
        <span class="score" id="my-score"></span>
      </div>
      <div id="stage"></div>
      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/catchmind-canvas.js"></script>
  <script src="/catchmind.js"></script>
</body>
</html>
