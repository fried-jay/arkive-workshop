<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스태프 콘솔</title>
  <link rel="stylesheet" href="/style.css">
  <style> .wrap { max-width: 640px; } </style>
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <h1>🎛️ 스태프 콘솔</h1>
      <p class="muted">역할을 골라주세요. <b>관리자</b>는 행사 전 내용 준비, <b>진행자</b>는 행사 중 라이브 진행이에요.</p>
    </div>

    <div class="role-tabs">
      <button id="tab-host" class="active" type="button">🎬 진행자 · 라이브</button>
      <button id="tab-manage" type="button">⚙️ 관리자 · 준비</button>
    </div>

    <div id="panel-host"></div>
    <div id="panel-manage" class="hidden"></div>

    <div class="hub-foot">
      <a href="/">🏕️ 참가자 허브</a>
      <a href="/manual.html">📖 진행 매뉴얼</a>
    </div>
  </div>

  <script>
    const GAMES = [
      { key:'bingo',    emoji:'🎯', name:'빙고',          color:'#5b53e8', admin:'/admin.html',            board:'/board.html',            live:'현황판 띄우고 진행 상황 지켜보기', setup:'항목 25개 등록 · 게임 리셋' },
      { key:'quiz',     emoji:'⚡', name:'퀴즈',          color:'#d97706', admin:'/quiz-admin.html',       board:'/quiz-board.html',       live:'다음 문제 · 정답 공개',            setup:'문제·보기·정답 등록' },
      { key:'tmi',      emoji:'🤫', name:'TMI 주인 찾기', color:'#db2777', admin:'/tmi-admin.html',        board:'/tmi-board.html',        live:'힌트 하나씩 공개 · 주인 발표',    setup:'TMI 3개 수집 시작' },
      { key:'balance',  emoji:'⚖️', name:'밸런스 게임',   color:'#0d9488', admin:'/balance-admin.html',    board:'/balance-board.html',    live:'다음 라운드 · 결과 공개',          setup:'A vs B 라운드 등록' },
      { key:'catchmind',emoji:'🎨', name:'캐치마인드',    color:'#7c3aed', admin:'/catchmind-admin.html',  board:'/catchmind-board.html',  live:'그림 링크 발급 · 정답 공개',      setup:'제시어·순서 준비' },
      { key:'manito',   emoji:'💌', name:'마니또',        color:'#e11d48', admin:'/manito-admin.html',     board:'/manito-board.html',     live:'대공개 진행',                      setup:'참가자 배정 · 시작' },
      { key:'prophecy', emoji:'🔮', name:'몰래 예언',     color:'#0891b2', admin:'/prophecy-admin.html',   board:'/prophecy-board.html',   live:'대공개 · 적중 판정',              setup:'예언 봉인 시작' },
      { key:'hidden',   emoji:'🔍', name:'숨은그림찾기',   color:'#0ea5e9', admin:'/hidden-admin.html',     board:'/hidden-board.html',     live:'시작 · 다음 라운드 진행',          setup:'라운드 자동 생성' },
    ];

    function row(g, role) {
      const desc = role === 'host' ? g.live : g.setup;
      let actions;
      if (role === 'host') {
        actions =
          '<a class="btn small secondary" href="' + g.board + '">📺 현황판</a>' +
          '<a class="btn small" href="' + g.admin + '">🎬 라이브</a>';
      } else {
        actions = '<a class="btn small" href="' + g.admin + '">⚙️ 내용 설정</a>';
      }
      return '<div class="game-row" style="--row-color:' + g.color + '">' +
        '<div><div class="name">' + g.emoji + ' ' + g.name + '</div>' +
        '<div class="desc">' + desc + '</div></div>' +
        '<div class="row-actions">' + actions + '</div></div>';
    }

    document.getElementById('panel-host').innerHTML = GAMES.map(g => row(g, 'host')).join('');
    document.getElementById('panel-manage').innerHTML = GAMES.map(g => row(g, 'manage')).join('');

    const tabHost = document.getElementById('tab-host');
    const tabManage = document.getElementById('tab-manage');
    const panelHost = document.getElementById('panel-host');
    const panelManage = document.getElementById('panel-manage');
    function select(role) {
      const host = role === 'host';
      tabHost.classList.toggle('active', host);
      tabManage.classList.toggle('active', !host);
      panelHost.classList.toggle('hidden', !host);
      panelManage.classList.toggle('hidden', host);
      try { localStorage.setItem('staff-role', role); } catch (e) {}
    }
    tabHost.addEventListener('click', () => select('host'));
    tabManage.addEventListener('click', () => select('manage'));
    let saved = 'host';
    try { saved = localStorage.getItem('staff-role') || 'host'; } catch (e) {}
    select(saved);
  </script>
</body>
</html>
