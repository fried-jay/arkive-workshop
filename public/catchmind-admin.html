<!doctype html>
<html lang="ko">
<head>
  <script src="/staff-gate.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캐치마인드 관리자</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <h1>🎨 캐치마인드 관리자</h1>
      <p class="muted">참가자가 미리 제출한 그림을 하나씩 공개하고, 손든 사람 중 정답자를 지정하세요.</p>
    </div>
    <section class="card">
      <h2>제시어 뱅크 (선택)</h2>
      <p class="muted">한 줄에 하나: <code>제시어 | 힌트1 | 힌트2</code>. 등록하면 참가자 링크에 제시어가 자동 배정돼요. (비워두면 참가자가 자유 단어로 그림)</p>
      <textarea id="prompts-input" style="min-height:160px" placeholder="회의 | 여러 명이 모여요 | 가끔 길어져요"></textarea>
      <div class="actions"><button class="btn" id="prompts-btn">제시어 등록</button></div>
      <p class="ok" id="prompts-ok"></p>
    </section>

    <section class="card">
      <div class="status-box" id="status-box">상태 불러오는 중...</div>
      <div class="roster-head">🖼️ 제출자</div>
      <ul class="roster" id="roster"></ul>
      <div class="actions">
        <button class="btn" id="start-btn">🚀 공개 시작</button>
        <button class="btn" id="next-btn">▶ 다음 그림</button>
        <a class="btn secondary" href="/catchmind-board.html" target="_blank">📺 현황판</a>
      </div>
      <div class="actions">
        <button class="btn secondary" id="hint-btn">💡 힌트 공개</button>
      </div>
      <div class="timer-row">
        <input type="text" id="winner-input" placeholder="정답자 이름" autocomplete="off">
        <button class="btn" id="winner-btn">🏆 정답자 지정</button>
        <button class="btn secondary small" id="reveal-btn">정답만 공개(정답자 없음)</button>
      </div>
      <div class="actions">
        <button class="btn secondary" id="reset-btn">🔄 진행 리셋 (제출물 유지)</button>
        <button class="btn ghost" id="clear-btn">🗑️ 제출물 전체 삭제</button>
      </div>
      <p class="ok" id="ok-msg"></p>
      <p class="error" id="error-msg"></p>
    </section>
  </div>
  <script src="/admin-roster.js"></script>
  <script src="/catchmind-admin.js"></script>
</body>
</html>
