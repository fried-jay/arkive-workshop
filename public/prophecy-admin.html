<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>몰래 예언 관리자</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .ok { color: #16a34a; font-size: 0.9rem; min-height: 1.2em; margin-top: 8px; }
    .status-box {
      margin-top: 16px; padding: 14px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--accent-soft); font-weight: 700;
    }
    .judge { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .judge li {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    .judge .txt { font-size: 0.95rem; }
    .judge .txt small { color: var(--muted); display: block; }
    .mini { padding: 8px 12px; font-size: 0.85rem; border-radius: 8px; }
    .mini.on-hit { outline: 2px solid #16a34a; }
    .mini.on-miss { outline: 2px solid #dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>🛠️ 몰래 예언 관리자</h1>
      <p class="muted">워크숍 시작 직후 <b>봉인</b>하세요 (늦게 내면 이미 일어난 일을 적는 반칙 가능!). 마무리에 <b>대공개</b> 후, 하나씩 읽으며 다 같이 판정하고 아래에서 ⭕/❌를 눌러주세요.</p>
      <div class="status-box" id="status-box">상태 불러오는 중...</div>
      <div class="actions">
        <button class="btn" id="seal-btn">🔒 봉인 (제출 마감)</button>
        <button class="btn" id="reveal-btn">🔮 대공개</button>
        <button class="btn secondary" id="reset-btn">리셋</button>
      </div>
      <ul class="judge" id="judge"></ul>
      <p class="ok" id="ok-msg"></p>
      <p class="error" id="error-msg"></p>
    </section>
  </div>
  <script src="/prophecy-admin.js"></script>
</body>
</html>
