<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캐치마인드 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 960px; }
    canvas { width: 100%; border: 3px solid var(--border); border-radius: 16px; background: #fff; display: block; }
    .waiting { text-align: center; padding: 60px 0; font-size: 1.4rem; }
    .feed { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .feed li { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
    .owner-reveal { text-align: center; font-size: 2rem; font-weight: 900; margin-top: 24px; color: #16a34a; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; }
    .ranking { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rank-row {
      display: grid; grid-template-columns: 2.5rem 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; font-size: 1.2rem; font-weight: 700;
    }
    .rank-row.top { border-color: var(--gold); background: #fffbeb; }
    .rank-no { color: var(--muted); font-weight: 800; }
    .rank-score { color: var(--accent); font-variant-numeric: tabular-nums; }
    h2 { font-size: 1.2rem; margin: 28px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta">
      <h1>🎨 캐치마인드</h1>
      <span class="muted" id="progress"></span>
    </div>
    <div id="stage"></div>
    <h2 id="ranking-title" class="hidden">🏆 순위</h2>
    <ul class="ranking" id="ranking"></ul>
  </div>
  <script src="/catchmind-canvas.js"></script>
  <script src="/catchmind-board.js"></script>
</body>
</html>
