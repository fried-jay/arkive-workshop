<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>TMI 주인 찾기</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .tmi-inputs { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .hint {
      background: var(--accent-soft);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .hint .no { color: var(--accent); font-size: 0.8rem; display: block; font-weight: 700; margin-bottom: 2px; }
    .hints { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .waiting { text-align: center; padding: 30px 0; }
    .owner-reveal { text-align: center; font-size: 1.2rem; font-weight: 800; margin-top: 16px; color: #16a34a; }
    .my-tmi { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 0.9rem; }
    .my-tmi ol { margin: 6px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="submit-view" class="card">
      <h1>🤫 TMI 주인 찾기</h1>
      <p class="muted">이름과 나만 아는 TMI를 <b>3개</b> 적어주세요. 워크숍에서 하나씩 힌트처럼 공개되고, 다 같이 주인을 추리합니다. (다시 제출하면 수정돼요)</p>
      <form id="submit-form">
        <input type="text" id="name-input" placeholder="이름" autocomplete="off" maxlength="20">
        <div class="tmi-inputs">
          <input type="text" id="tmi-1" placeholder="TMI 1 — 예) 사실 나 스카이다이빙 자격증 있음" autocomplete="off" maxlength="100">
          <input type="text" id="tmi-2" placeholder="TMI 2" autocomplete="off" maxlength="100">
          <input type="text" id="tmi-3" placeholder="TMI 3" autocomplete="off" maxlength="100">
        </div>
        <p class="error" id="submit-error"></p>
        <button class="btn" type="submit">제출하기</button>
      </form>
      <div class="my-tmi hidden" id="my-tmi"></div>
    </section>

    <section id="game-view" class="card hidden">
      <h1 id="round-title"></h1>
      <p class="muted" id="round-sub"></p>
      <div id="stage"></div>
    </section>
  </div>
  <script src="/tmi.js"></script>
</body>
</html>
