<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>TMI 주인 찾기</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choice {
      border: 1px solid var(--border); border-radius: 12px; background: var(--card);
      padding: 14px; font-size: 1rem; font-family: inherit; color: var(--text);
      text-align: left; cursor: pointer;
    }
    .choice.mine { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .choice.correct { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 700; }
    .choice.wrong-mine { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 700; }
    .choice:disabled { cursor: default; opacity: 0.9; }
    .tmi-text {
      font-size: 1.1rem; font-weight: 700; margin: 12px 0 0;
      background: var(--accent-soft); border-radius: 12px; padding: 16px;
    }
    .waiting { text-align: center; padding: 30px 0; }
    .score { font-weight: 800; color: var(--accent); }
    .result-msg { font-size: 1.05rem; font-weight: 700; margin-top: 14px; }
    .my-tmi { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="submit-view" class="card">
      <h1>🤫 TMI 주인 찾기</h1>
      <p class="muted">이름과 나만 아는 TMI를 하나 적어주세요. 워크숍에서 "이 TMI 주인은 누구?" 퀴즈로 나옵니다. (제출 후 다시 제출하면 수정돼요)</p>
      <form id="submit-form">
        <input type="text" id="name-input" placeholder="이름" autocomplete="off" maxlength="20">
        <p></p>
        <input type="text" id="tmi-input" placeholder="예) 사실 나 스카이다이빙 자격증 있음" autocomplete="off" maxlength="100">
        <p class="error" id="submit-error"></p>
        <button class="btn" type="submit">제출하기</button>
      </form>
      <div class="my-tmi hidden" id="my-tmi"></div>
    </section>

    <section id="game-view" class="card hidden">
      <div class="statusbar" style="margin-top:0">
        <span id="greeting"></span>
        <span class="score" id="my-score"></span>
      </div>
      <div id="stage"></div>
      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/tmi.js"></script>
</body>
</html>
