<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>워크숍 빙고</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .grid.locked .cell { cursor: default; opacity: 0.92; }
    .phase {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 14px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--accent-soft); font-weight: 700; color: var(--accent);
    }
    .phase .sub { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
    .call-banner { padding:14px; border-radius:12px; background:#f1f3f8; color:var(--muted); font-weight:800; text-align:center; font-size:1.05rem; }
    .call-banner.on { background:var(--accent); color:#fff; }
    .cell.active { border-color:var(--gold); box-shadow:0 0 0 3px #fde68a; animation:pulse 1s infinite; }
    .cell.wait { opacity:0.4; }
    .cell.locked { opacity:0.55; cursor:default; }
    .cell.locked.marked, .cell.active.marked { opacity:1; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 3px #fde68a;} 50%{box-shadow:0 0 0 6px #fcd34d;} }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="join-view" class="card">
      <h1>🎯 워크숍 빙고</h1>
      <p class="muted">본인 이름을 선택하면 나만의 빙고판이 만들어져요.</p>
      <input type="text" id="roster-filter" placeholder="이름 검색" autocomplete="off">
      <div id="roster-list" class="name-grid"></div>
      <p class="error" id="join-error"></p>
    </section>

    <section id="game-view" class="card hidden">
      <h1 id="greeting"></h1>

      <!-- 시작 전: 배치 조정 + 레디 -->
      <div id="setup-view">
        <p class="muted" id="setup-hint">배치가 마음에 안 들면 <b>다시 섞기</b>, 준비되면 <b>레디</b>를 눌러주세요.</p>
        <div class="grid locked" id="grid"></div>
        <div class="phase">
          <span id="ready-status">레디 대기 중</span>
          <span class="sub" id="ready-count"></span>
        </div>
        <div class="actions">
          <button class="btn secondary" id="shuffle-btn">🎲 다시 섞기</button>
          <button class="btn" id="ready-btn">✅ 레디</button>
        </div>
      </div>

      <!-- 시작 후: 마킹 -->
      <div id="play-view" class="hidden">
        <div class="call-banner" id="call-banner">진행자가 항목을 부르길 기다려요…</div>
        <p class="muted" style="margin:8px 0 0">📢 불린 항목(반짝임)만 15초 안에 칠할 수 있어요.</p>
        <div class="grid" id="play-grid"></div>
        <div class="statusbar">
          <span id="marked-count"></span>
          <span class="bingo-count" id="bingo-count"></span>
        </div>
      </div>

      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/roster-join.js"></script>
  <script src="/bingo.js"></script>
</body>
</html>
