<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마니또 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 900px; }
    .waiting { text-align: center; padding: 60px 0; font-size: 1.3rem; }
    .names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }
    .name-chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
    .pairs { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .pairs li {
      display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 18px; font-size: 1.2rem; font-weight: 700;
    }
    .pairs .arrow { color: var(--muted); }
    .pairs .right { color: #16a34a; font-size: 0.9rem; text-align: right; }
    .note-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💌 마니또</h1>
    <p class="muted" id="progress"></p>
    <div id="stage"></div>
  </div>
  <script src="/manito-board.js"></script>
</body>
</html>
