<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>밸런스 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 960px; }
    .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; margin-top: 16px; }
    .side {
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      padding: 36px 20px;
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    .side.majority { border-color: var(--gold); background: #fffbeb; }
    .vs { align-self: center; font-size: 2rem; font-weight: 900; color: var(--muted); }
    .pct { font-size: 1.2rem; color: var(--muted); font-weight: 700; }
    .bar { height: 14px; border-radius: 7px; background: var(--accent-soft); overflow: hidden; }
    .bar > div { height: 100%; background: var(--accent); transition: width 0.4s; }
    .waiting { text-align: center; padding: 60px 0; font-size: 1.4rem; }
    .meta { display: flex; justify-content: space-between; align-items: center; }
    .voted { font-weight: 800; color: var(--accent); font-size: 1.2rem; }
    .ranking { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rank-row {
      display: grid; grid-template-columns: 2.5rem 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; font-size: 1.2rem; font-weight: 700;
    }
    .rank-row.top { border-color: var(--gold); background: #fffbeb; }
    .rank-no { color: var(--muted); font-weight: 800; }
    .rank-score { color: var(--accent); font-variant-numeric: tabular-nums; }
    h2 { font-size: 1.2rem; margin: 28px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta">
      <h1>⚖️ 밸런스 현황판</h1>
      <span class="voted" id="voted"></span>
    </div>
    <p class="muted" id="progress"></p>
    <div id="stage"></div>
    <h2 id="ranking-title" class="hidden">🏆 순위</h2>
    <ul class="ranking" id="ranking"></ul>
  </div>
  <script src="/balance-board.js"></script>
</body>
</html>
