<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>마니또</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .target-card {
      background: var(--accent-soft);
      border: 2px dashed var(--accent);
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
      text-align: center;
    }
    .target-card .label { display: block; font-size: 0.78rem; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 6px; }
    .target-card .name { font-size: 1.6rem; font-weight: 800; }
    .note-box { background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 0.92rem; }
    .waiting { text-align: center; padding: 24px 0; }
    select {
      width: 100%; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font-size: 1rem; font-family: inherit; background: var(--card); color: var(--text);
    }
    .guess-box { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .guess-box .row { display: flex; gap: 8px; margin-top: 10px; }
    .guess-box select { flex: 1; }
    .ok { color: #16a34a; font-size: 0.9rem; min-height: 1.2em; margin-top: 8px; }
    .result-msg { font-size: 1.1rem; font-weight: 800; margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="join-view" class="card">
      <h1>💌 마니또</h1>
      <p class="muted">본인 이름을 선택해 입장하세요. 시작되면 몰래 챙겨줄 사람이 비밀로 배정됩니다.</p>
      <input type="text" id="roster-filter" placeholder="이름 검색" autocomplete="off">
      <div id="roster-list" class="name-grid"></div>
      <p class="error" id="join-error"></p>
    </section>

    <section id="game-view" class="card hidden">
      <h1 id="greeting" style="font-size:1.2rem"></h1>
      <div id="stage"></div>
      <p class="ok" id="ok-msg"></p>
      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/roster-join.js"></script>
  <script src="/manito.js"></script>
</body>
</html>
