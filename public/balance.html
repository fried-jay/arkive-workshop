<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>밸런스 게임</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .vs-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .vs-label { text-align: center; font-weight: 800; color: var(--muted); }
    .side {
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      padding: 22px 14px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }
    .side.mine { background: var(--accent); border-color: var(--accent); color: #fff; }
    .side.majority { border-color: var(--gold); background: #fffbeb; }
    .side:disabled { cursor: default; opacity: 0.95; }
    .side .pct { display: block; font-size: 0.9rem; color: inherit; opacity: 0.8; margin-top: 6px; }
    .waiting { text-align: center; padding: 30px 0; }
    .score { font-weight: 800; color: var(--accent); }
    .result-msg { font-size: 1.05rem; font-weight: 700; margin-top: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="join-view" class="card">
      <h1>⚖️ 밸런스 게임</h1>
      <p class="muted">본인 이름을 선택해 입장하세요.</p>
      <input type="text" id="roster-filter" placeholder="이름 검색" autocomplete="off">
      <div id="roster-list" class="name-grid"></div>
      <p class="error" id="join-error"></p>
    </section>

    <section id="game-view" class="card hidden">
      <div class="statusbar" style="margin-top:0">
        <span id="greeting"></span>
        <span class="score" id="my-score"></span>
      </div>
      <div id="stage"></div>
      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/roster-join.js"></script>
  <script src="/balance.js"></script>
</body>
</html>
