<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>워크숍 퀴즈</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .choice {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      padding: 14px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .choice.mine { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .choice.correct { background: #16a34a; border-color: #16a34a; color: #fff; font-weight: 700; }
    .choice.wrong-mine { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 700; }
    .choice:disabled { cursor: default; opacity: 0.9; }
    .question-text { font-size: 1.15rem; font-weight: 700; margin: 12px 0 0; }
    .waiting { text-align: center; padding: 30px 0; }
    .score { font-weight: 800; color: var(--accent); }
    .result-msg { font-size: 1.05rem; font-weight: 700; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="join-view" class="card">
      <h1>⚡ 워크숍 퀴즈</h1>
      <p class="muted">이름을 입력하고 입장하세요.</p>
      <form id="join-form">
        <input type="text" id="name-input" placeholder="이름" autocomplete="off" maxlength="20">
        <p class="error" id="join-error"></p>
        <button class="btn" type="submit">입장하기</button>
      </form>
    </section>

    <section id="game-view" class="card hidden">
      <div class="statusbar" style="margin-top:0">
        <span id="greeting"></span>
        <span class="score" id="my-score"></span>
      </div>
      <div id="stage"></div>
      <p class="error" id="game-error"></p>
    </section>
  </div>
  <script src="/quiz.js"></script>
</body>
</html>
