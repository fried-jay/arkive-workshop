<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마니또 관리자</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .ok { color: #16a34a; font-size: 0.9rem; min-height: 1.2em; margin-top: 8px; }
    .status-box {
      margin-top: 16px; padding: 14px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--accent-soft); font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>🛠️ 마니또 관리자</h1>
      <p class="muted">참가자가 3명 이상 모이면 시작하세요. 시작하면 한 줄 사이클로 비밀 배정되고 <b>이후엔 새 참가자가 못 들어옵니다</b>. 안내문(마니또 미션)은 선택사항이에요.</p>
      <input type="text" id="note-input" placeholder="안내문 (예: 오늘 안에 몰래 칭찬 1번 + 간식 1개 챙겨주기)" maxlength="100">
      <div class="actions">
        <button class="btn secondary" id="note-btn">안내문 저장</button>
      </div>
      <div class="status-box" id="status-box">상태 불러오는 중...</div>
      <div class="actions">
        <button class="btn" id="start-btn">🚀 마니또 배정 시작</button>
        <button class="btn" id="reveal-btn">💝 대공개</button>
        <button class="btn secondary" id="reset-btn">리셋</button>
      </div>
      <p class="ok" id="ok-msg"></p>
      <p class="error" id="error-msg"></p>
    </section>
  </div>
  <script src="/manito-admin.js"></script>
</body>
</html>
