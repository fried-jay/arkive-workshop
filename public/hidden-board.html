<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숨은그림찾기 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 960px; }
    .meta { display:flex; justify-content:space-between; align-items:baseline; }
    .target-banner { display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0;
      padding:18px; border-radius:16px; background:var(--accent-soft); color:var(--accent); font-weight:900; font-size:1.6rem; }
    .target-banner .big { font-size:2.6rem; }
    .hgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; max-width:560px; margin:0 auto; }
    .hcell { aspect-ratio:1; border:2px solid var(--border); border-radius:12px; background:#fff;
      font-size:2rem; display:flex; align-items:center; justify-content:center; }
    .ranking { list-style:none; margin:22px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
    .rank-row { display:grid; grid-template-columns:2.5rem 1fr auto auto; gap:12px; align-items:center;
      background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:1.2rem; font-weight:700; }
    .rank-row.top { border-color:var(--gold); background:#fffbeb; }
    .rank-no { color:var(--muted); font-weight:800; }
    .rank-found { color:var(--muted); font-size:0.95rem; }
    .rank-score { color:var(--accent); font-variant-numeric:tabular-nums; }
    .waiting { text-align:center; padding:60px 0; font-size:1.4rem; }
    .clear-banner { margin:16px auto 0; max-width:560px; padding:16px 20px; border-radius:16px; background:#fffbeb; border:2px solid var(--gold);
      color:#92400e; font-weight:900; font-size:1.5rem; text-align:center; }
    .clear-banner .others { display:block; font-size:1rem; font-weight:700; margin-top:6px; color:#a16207; }
    .rank-clear { color:var(--ok); font-size:0.95rem; font-weight:800; }
    h2 { font-size:1.2rem; margin:26px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta"><h1>🔍 숨은그림찾기</h1><span class="muted" id="progress"></span></div>
    <div id="stage"></div>
    <div class="clear-banner hidden" id="clear-banner"></div>
    <h2 id="ranking-title" class="hidden">🏆 순위</h2>
    <ul class="ranking" id="ranking"></ul>
  </div>
  <script src="/hidden-board.js"></script>
</body>
</html>
