<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMI 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 960px; }
    .hints { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
    .hint {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
      font-size: 1.6rem;
      font-weight: 800;
    }
    .hint .no { display: block; color: var(--accent); font-size: 0.85rem; letter-spacing: 0.08em; margin-bottom: 4px; }
    .waiting { text-align: center; padding: 60px 0; font-size: 1.4rem; }
    .names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }
    .name-chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
    .owner-reveal { text-align: center; font-size: 2rem; font-weight: 900; margin-top: 28px; color: #16a34a; }
    .prompt { text-align: center; font-size: 1.3rem; font-weight: 700; margin-top: 28px; color: var(--muted); }
    .meta { display: flex; justify-content: space-between; align-items: baseline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta">
      <h1>🤫 이 TMI의 주인은?</h1>
      <span class="muted" id="progress"></span>
    </div>
    <div id="stage"></div>
  </div>
  <script src="/tmi-board.js"></script>
</body>
</html>
