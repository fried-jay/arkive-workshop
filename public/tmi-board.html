<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMI 현황판</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .wrap { max-width: 960px; }
    .tmi-text {
      font-size: 1.9rem; font-weight: 800; margin: 12px 0 20px;
      background: var(--accent-soft); border-radius: 16px; padding: 28px;
      text-align: center;
    }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice {
      border: 2px solid var(--border); border-radius: 14px; background: var(--card);
      padding: 18px; font-size: 1.3rem; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
    }
    .choice.correct { border-color: #16a34a; background: #f0fdf4; }
    .choice .cnt { color: var(--muted); font-size: 1rem; }
    .waiting { text-align: center; padding: 60px 0; font-size: 1.4rem; }
    .meta { display: flex; justify-content: space-between; align-items: center; }
    .answered { font-weight: 800; color: var(--accent); font-size: 1.2rem; }
    .names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }
    .name-chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
    .ranking { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .rank-row {
      display: grid; grid-template-columns: 2.5rem 1fr auto; gap: 12px; align-items: center;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; font-size: 1.2rem; font-weight: 700;
    }
    .rank-row.top { border-color: var(--gold); background: #fffbeb; }
    .rank-no { color: var(--muted); font-weight: 800; }
    .rank-score { color: var(--accent); font-variant-numeric: tabular-nums; }
    h2 { font-size: 1.2rem; margin: 28px 0 0; }
    .owner-reveal { text-align: center; font-size: 1.4rem; font-weight: 800; margin-top: 18px; color: #16a34a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="meta">
      <h1>🤫 TMI 주인 찾기</h1>
      <span class="answered" id="answered"></span>
    </div>
    <p class="muted" id="progress"></p>
    <div id="stage"></div>
    <h2 id="ranking-title" class="hidden">🏆 순위</h2>
    <ul class="ranking" id="ranking"></ul>
  </div>
  <script src="/tmi-board.js"></script>
</body>
</html>
